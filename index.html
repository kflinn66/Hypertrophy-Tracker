<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hypertrophy Tracker</title>
<meta name="description" content="Personal workout tracker with volume landmarks, RIR autoregulation, and auto-progression.">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HyperTrack">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="view"><p class="muted">Loading…</p></div>
</div>

<button id="installBtn" class="btn ghost" style="display:none">Install App</button>

<script>
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('installBtn');
    btn.style.display = 'block';
    btn.addEventListener('click', async () => {
      btn.style.display = 'none';
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      }
    });
  });
  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'none';
  });
</script>

<script src="volume-landmarks.js"></script>
<script src="exercises.js"></script>
<script src="exercise-media.js"></script>
<script src="plans.js"></script>
<script src="progression.js"></script>
<script src="db.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
